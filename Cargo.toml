[package]
name = "rage-formats"
version = "0.2.2"
edition = "2021"
description = "Parsers (and writers) for RAGE resource formats — RSC7 textures, drawables, fragments, meta/PSO data, collision and navmeshes — as found inside GTA V RPF archives"
license = "Unlicense"
repository = "https://github.com/VIRUXE/rage-formats"
keywords = ["gta", "rage", "ydr", "ytd", "rsc7"]
categories = ["parsing", "game-development"]

[features]
default = ["image", "encode"]
# `to_rgba_image`, `fit_max_size` and `encode_image` in `texture_utils`;
# without it the crate still decodes textures to raw RGBA bytes.
image = ["dep:image"]
# `texture_encode`: PNG/TGA -> BC1/BC3/BC4/BC5/BC7 with mip chains (pure Rust).
encode = ["dep:rusty_dds"]
# Exposes `ydd::tests::minimal_ydr_sections`, `ytyp::tests::minimal_mlo_ytyp`,
# `ymap::tests::sample_exterior_ymap`, `pso::tests::sample_pso` and
# `meta_schema::tests::sample_meta` for
# downstream crates' tests.
test-support = []

[dependencies]
anyhow = "1.0"
flate2 = "1.0"
roxmltree = "0.20"
json = "0.12"
texture2ddecoder = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tga", "bmp"], optional = true }
rusty_dds = { version = "0.9", default-features = false, features = ["encode"], optional = true }

# rusty_dds has a debug_assert in its BC7 seed search that real images
# trip; release builds are unaffected, so debug builds get the same code.
[profile.dev.package.rusty_dds]
debug-assertions = false
opt-level = 3
